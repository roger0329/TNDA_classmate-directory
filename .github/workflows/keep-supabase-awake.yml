name: Keep Supabase project awake

# Supabase 免費方案在專案「連續一段時間沒有足夠的活動」時會自動暫停(pause)專案。
# 資料不會不見，只是暫停中，之後要用的話回 Supabase 後台按一下「Restore」就能復原。
#
# 這個排程原本是用單純的「讀取」API 保活，但實測發現 Supabase 不一定會把
# 單純的讀取算進「有在用」，所以改成每天對資料庫做一次真正的「寫入」
# (UPDATE 一張叫 keepalive_ping 的小表，只存一個時間戳記)，比較能被
# Supabase 判定成專案有在使用。
#
# 設定方式：
#   1. 先到 Supabase 的 SQL Editor 執行過 supabase-setup.sql(裡面已經包含
#      建立 keepalive_ping 這張表跟它的權限設定)。
#   2. 把下面兩個 YOUR_PROJECT_URL / YOUR_ANON_KEY 換成你在 index.html 裡
#      SUPABASE_URL / SUPABASE_ANON_KEY 填的同一組值。
#   3. 把這個檔案連同資料夾結構(.github/workflows/keep-supabase-awake.yml)
#      一起上傳到你的 GitHub repo(跟 index.html 同一個 repo)。
#   4. 上傳後到 repo 的「Actions」分頁，確認這個 workflow 有出現、是 enabled 的狀態即可，
#      不需要再做其他事，它會自動照排程執行。
#
# 就算這樣還是被暫停(免費方案本來就無法 100% 保證不暫停)，也不會弄丟資料，
# 回後台按一下「Restore」、等 1-2 分鐘就復原了。

on:
  schedule:
    - cron: "0 3 * * *"  # 每天執行一次，降低被暫停的風險
  workflow_dispatch: {}   # 也可以到 Actions 分頁手動點一次來測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat row to Supabase (real write, not just a read)
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -X PATCH \
            "https://gprlshtecrpttccdyeup.supabase.co/rest/v1/keepalive_ping?id=eq.1" \
            -H "apikey: sb_publishable_mCEeggua_V--_EeNe2nbHQ_9MECDkJX" \
            -H "Authorization: Bearer sb_publishable_mCEeggua_V--_EeNe2nbHQ_9MECDkJX" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\":\"$NOW\"}"
