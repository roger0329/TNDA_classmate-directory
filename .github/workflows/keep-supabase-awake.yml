name: Keep Supabase project awake

# Supabase's free方案在專案「連續 7 天沒有任何 API 請求」時會自動暫停(pause)專案。
# 資料不會不見，只是暫停中，之後要用的話回 Supabase 後台按一下「Restore」就能復原，
# 但這個排程可以每 3 天自動打一次 API，讓專案一直保持在有在用的狀態，完全不用手動管理。
#
# 設定方式：
#   1. 把下面兩個 YOUR_PROJECT_URL / YOUR_ANON_KEY 換成你在 index.html 裡
#      SUPABASE_URL / SUPABASE_ANON_KEY 填的同一組值。
#   2. 把這個檔案連同資料夾結構(.github/workflows/keep-supabase-awake.yml)
#      一起上傳到你的 GitHub repo(跟 index.html 同一個 repo)。
#   3. 上傳後到 repo 的「Actions」分頁，確認這個 workflow 有出現、是 enabled 的狀態即可，
#      不需要再做其他事，它會自動照排程執行。

on:
  schedule:
    - cron: "0 3 */3 * *"  # 每 3 天執行一次
  workflow_dispatch: {}     # 也可以到 Actions 分頁手動點一次來測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://gprlshtecrpttccdyeup.supabase.co/rest/v1/students_public?select=id&limit=1" \
            -H "apikey: sb_publishable_mCEeggua_V--_EeNe2nbHQ_9MECDkJX" \
            -H "Authorization: Bearer sb_publishable_mCEeggua_V--_EeNe2nbHQ_9MECDkJX"
