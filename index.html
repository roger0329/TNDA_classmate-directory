<title>同學錄</title>
<style>
  :root{
    --bg:#ffffff;
    --surface:#f0f0ee;
    --surface-2:#e2e2de;
    --text:#0a0a0a;
    --muted:#5c5c58;
    --line:rgba(10,10,10,0.2);
    --header-h:64px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
  }
  h1,h2,h3{font-family:"Noto Sans TC","PingFang TC",sans-serif;font-weight:100;margin:0;text-wrap:balance;letter-spacing:0.08em;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* ---------------- top bar ---------------- */
  .topbar{
    position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    height:var(--header-h);padding-inline:22px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
  }
  .wordmark{font-family:"Noto Sans TC",sans-serif;font-weight:100;font-size:1.15rem;letter-spacing:0.14em;}
  .nav-link{font-size:0.76rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text);padding:6px 2px;position:relative;border:1px solid var(--line);padding:6px 14px;}
  .nav-link:hover{background:var(--text);color:var(--bg);}

  /* ---------------- stage: horizontal draggable row ---------------- */
  .stage{
    position:fixed;
    top:var(--header-h);left:0;right:0;bottom:0;
    display:flex;align-items:center;
    perspective:1400px;
  }
  .row-viewport{
    width:100%;height:100%;
    display:flex;align-items:center;
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-ms-overflow-style:none;
    cursor:grab;
    user-select:none;
  }
  .row-viewport::-webkit-scrollbar{display:none;}
  .row-viewport.dragging{cursor:grabbing;scroll-behavior:auto;}
  .stage-inner{
    display:flex;align-items:flex-start;
    gap:clamp(28px,5vw,64px);
    padding-inline:14vw;
    width:max-content;
  }
  @media (max-width:640px){
    .stage-inner{gap:24px;padding-inline:30vw;}
  }
  /* centered placeholder text shown while the roster is loading, or if it
     failed to load — replaces the stage-inner content, not shown alongside it */
  .stage-msg{
    font-family:"IBM Plex Mono",monospace;font-size:0.8rem;letter-spacing:0.04em;
    color:var(--muted);text-align:center;
  }

  /* ---------------- disc column ---------------- */
  .disc-wrap{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    flex:0 0 auto;
  }

  /* proportions follow a real 120mm CD: 15mm spindle hole, ~46mm hub/label edge, ~116mm data edge */
  .disc-3d{
    --size:clamp(240px, 46vh, 520px);
    width:var(--size);height:var(--size);
    border-radius:50%;
    position:relative;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    cursor:grab;
    touch-action:none;
    filter:drop-shadow(0 6px 10px rgba(10,10,10,0.28));
    transition:filter .3s ease;
  }
  .disc-3d:active{cursor:grabbing;}
  .disc-wrap:hover .disc-3d{filter:drop-shadow(0 9px 14px rgba(10,10,10,0.32));}

  /* two physical faces of the disc, back-to-back — like a real CD: label side (photo) vs data side (grooves) */
  /* which face paints is driven entirely by JS (see updateFace) rather than
     backface-visibility, which didn't cull reliably mid-rotation here.
     Each face sits slightly off-center on the rotation axis (translateZ) so
     the disc has real depth instead of both faces being perfectly coplanar —
     .disc-edge (below) fills the gap between them as the rim/spine. */
  .disc-face{
    position:absolute;inset:0;border-radius:50%;
    transition:opacity .12s linear;
    transform:translateZ(4px);
  }
  .disc-face-back{transform:rotateY(180deg) translateZ(4px);}
  .disc-3d:not(.showing-back) .disc-face-back{opacity:0;}
  .disc-3d.showing-back .disc-face-front{opacity:0;}

  /* the disc's edge/spine — sits between the two faces (z:0, they're pushed
     to +-4px) and is very slightly larger, so it peeks out as a thin
     light-catching rim at the silhouette and while tilted/turning, giving
     the disc real thickness instead of reading as a flat cutout. */
  .disc-edge{
    position:absolute;inset:-1.6%;border-radius:50%;
    background:conic-gradient(from -40deg,
      #f6f6f4 0deg, #cfcfca 20deg, #8f8f89 45deg, #cfcfca 70deg, #f6f6f4 95deg,
      #dcdcd8 135deg, #9a9a95 180deg, #dcdcd8 225deg,
      #f6f6f4 265deg, #cfcfca 290deg, #8f8f89 315deg, #cfcfca 340deg, #f6f6f4 360deg);
    pointer-events:none;
  }

  /* outer unrecorded rim: 96.7%-100% of 120mm disc (present on both faces) */
  .disc-rim{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle, transparent 0 96.5%, rgba(10,10,10,0.55) 96.7% 98.5%, rgba(10,10,10,0.18) 98.6% 100%);
  }
  /* front / label side: the student's own photo, filling the printable area (~38.3%-96.7%) */
  .disc-cover{
    position:absolute;inset:0;border-radius:50%;
    background-size:cover;background-position:center;
    border:1px solid var(--line);
  }
  .disc-cover.placeholder{
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
  }
  .disc-cover .ph-initial{
    font-family:"Noto Sans TC",sans-serif;font-weight:100;
    font-size:clamp(2.4rem,8vh,4.6rem);
    color:var(--muted);
  }
  /* soft matte/frosted grain over the photo — just enough that a printed
     cover still reads as a physical disc surface, not etched concentric
     grooves (that read as too harsh over a face/photo) */
  .disc-texture{
    position:absolute;inset:0;border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,0.045) 0 1px, rgba(255,255,255,0.05) 1px 2px, transparent 2px 9px);
    mix-blend-mode:soft-light;
    opacity:0.5;
    pointer-events:none;
  }
  /* raking studio-light glare, like a photographed disc under a spotlight —
     position shifts as the disc turns, see updateFace() in the script below */
  .disc-sheen{
    position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(115deg,
      transparent 15%,
      rgba(255,255,255,0.04) 30%,
      rgba(255,255,255,0.38) 46%,
      rgba(255,255,255,0.08) 58%,
      transparent 78%);
    background-size:230% 230%;
    background-position:50% 50%;
    mix-blend-mode:soft-light;
    pointer-events:none;
  }
  /* darkened falloff toward the rim, like light rolling off a curved reflective surface */
  .disc-vignette{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle, transparent 70%, rgba(0,0,0,0.14) 97%, rgba(0,0,0,0.22) 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  /* back / data side: the original concentric-groove look */
  .disc-groove{
    position:absolute;inset:0;border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(10,10,10,0.16) 0 1px, transparent 1px 6px),
      radial-gradient(circle at 36% 30%, #ffffff, var(--surface) 45%, var(--surface-2) 72%);
    border:1px solid var(--line);
  }
  /* spindle hole: 15mm of 120mm disc = 12.5% of overall diameter (one per face, punched through) */
  .disc-hole{
    position:absolute;left:50%;top:50%;
    width:12.5%;height:12.5%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:var(--bg);
    border:1px solid rgba(10,10,10,0.55);
    pointer-events:none;
  }
  .disc-name{
    font-size:0.92rem;color:var(--text);text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:18px;
    margin-top:22px;
    pointer-events:none;
  }
  .disc-name .nm{font-family:"Noto Sans TC",sans-serif;font-weight:300;font-size:1.2rem;letter-spacing:0.1em;}
  .disc-tags{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;
    max-width:260px;
  }
  .tag-chip{
    font-family:"IBM Plex Mono",monospace;font-size:0.64rem;letter-spacing:0.05em;
    padding:5px 12px;border:1px solid var(--line);color:var(--muted);
    white-space:nowrap;
  }
  .disc-tags{pointer-events:auto;}
  .disc-tags .tag-chip{cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;}
  .disc-tags .tag-chip:hover{border-color:var(--text);color:var(--text);}
  .disc-tags .tag-chip.chip-active{background:var(--text);color:var(--bg);border-color:var(--text);}

  .disc-wrap{transition:opacity .3s ease, transform .3s cubic-bezier(.2,.8,.25,1);}
  .disc-wrap.filtered-out{opacity:0;transform:scale(0.8);pointer-events:none;}
  /* once the fade above finishes, actually drop it out of the row (see applyFilter)
     so CDs that don't match don't leave gaps you have to scroll through — no
     compensating slide animation, the rest just settle into their new spot */
  .disc-wrap.collapsed{display:none;}
  .disc-wrap.selected{transform:scale(1.08);}

  .filter-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:44vw;}
  .filter-chip{
    display:inline-flex;align-items:center;gap:6px;
    font-family:"IBM Plex Mono",monospace;font-size:0.66rem;letter-spacing:0.03em;
    padding:5px 10px;border:1px solid var(--text);background:var(--text);color:var(--bg);
    cursor:pointer;white-space:nowrap;
  }
  .filter-chip:hover{opacity:0.75;}
  .filter-clear{font-size:0.7rem;letter-spacing:0.06em;color:var(--muted);white-space:nowrap;cursor:pointer;}
  .filter-clear:hover{color:var(--text);}
  @media (max-width:760px){ .filter-tags{max-width:100%;} }

  .filter-input-wrap{display:flex;align-items:stretch;}
  .filter-input{
    font-family:"IBM Plex Mono",monospace;font-size:0.7rem;
    background:var(--surface);border:1px solid var(--line);border-right:none;color:var(--text);
    padding:7px 10px;width:150px;outline:none;
  }
  .filter-input:focus{border-color:var(--text);}
  .filter-input::placeholder{color:var(--muted);}
  .filter-input-add{
    font-family:"IBM Plex Mono",monospace;font-size:0.8rem;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);
    padding:0 12px;cursor:pointer;
  }
  .filter-input-add:hover{background:var(--text);color:var(--bg);border-color:var(--text);}
  @media (max-width:900px){ .filter-input{width:90px;} }
  @media (max-width:640px){ .filter-input-wrap{display:none;} }

  /* a hollow ring (transparent center, transparent beyond) rather than a filled
     glow — the inside is already empty before it even starts moving, so as it
     expands outward and fades there's nothing left in the middle to read as
     "shrinking back in" */
  .disc-hl{
    position:absolute;inset:-6px;border-radius:50%;
    background:radial-gradient(circle, transparent 62%, rgba(10,10,10,0.08) 74%, transparent 88%);
    opacity:0;
    pointer-events:none;
  }
  .disc-wrap.pulse .disc-hl{animation:pulse 1.1s ease-out 1;}
  @keyframes pulse{
    0%{opacity:1;transform:scale(0.92);}
    100%{opacity:0;transform:scale(1.18);}
  }

  /* ---------------- intro corner ---------------- */
  .intro{
    position:fixed;left:22px;top:calc(var(--header-h) + 18px);z-index:10;
    max-width:280px;pointer-events:none;
  }
  .intro h1{font-size:clamp(1.2rem,2.4vw,1.6rem);line-height:1.35;}
  .intro-en{
    margin:10px 0 0;font-size:0.68rem;letter-spacing:0.08em;
    color:var(--muted);text-transform:uppercase;
  }
  @media (max-width:760px){ .intro{display:none;} }

  /* ---------------- index overlay ---------------- */
  .index-overlay{
    position:fixed;inset:0;z-index:80;background:var(--bg);
    display:flex;flex-direction:column;padding:calc(var(--header-h) + 16px) 28px 28px;
    opacity:0;visibility:hidden;transition:opacity .3s ease;
  }
  .index-overlay.open{opacity:1;visibility:visible;}
  .index-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:24px;font-size:0.74rem;letter-spacing:0.1em;color:var(--muted);}
  .index-close:hover{color:var(--text);}
  .index-search{max-width:360px;margin-bottom:24px;position:relative;}
  .index-search input{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:0;padding:10px 16px 10px 36px;font-size:0.86rem;outline:none;}
  .index-search input:focus{border-color:var(--text);}
  .index-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);}
  .index-count{font-family:"IBM Plex Mono",monospace;font-size:0.72rem;color:var(--muted);margin:-8px 0 20px;}
  .index-list{
    flex:1;overflow-y:auto;
    column-width:380px;column-gap:56px;
  }
  @media (max-width:800px){ .index-list{column-width:100%;} }
  .index-item{
    display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);
    font-family:"Noto Sans TC",sans-serif;font-weight:200;letter-spacing:0.06em;font-size:clamp(1rem,2.4vw,1.4rem);
    color:var(--muted);transition:color .2s ease, padding-left .2s ease;
    break-inside:avoid;
  }
  .index-item .iavatar{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;
    background-size:cover;background-position:center;background-color:var(--surface);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    filter:grayscale(1);opacity:0.7;transition:filter .2s ease, opacity .2s ease;
  }
  .index-item .iavatar .iav-init{font-family:"Noto Sans TC",sans-serif;font-weight:200;font-size:0.95rem;color:var(--muted);}
  .index-item .imeta{margin-left:auto;font-size:0.7rem;font-family:"IBM Plex Mono",monospace;color:var(--muted);text-transform:none;text-align:right;}
  .index-item:hover{color:var(--text);padding-left:12px;}
  .index-item:hover .iavatar{filter:grayscale(0);opacity:1;}
  .index-item[hidden]{display:none;}
  @media (max-width:640px){ .index-item .imeta{display:none;} }

  /* ---------------- detail panel ---------------- */
  .backdrop{
    position:fixed;inset:0;z-index:59;background:rgba(0,0,0,0.55);
    opacity:0;visibility:hidden;transition:opacity .3s ease;
  }
  .backdrop.open{opacity:1;visibility:visible;}
  .panel{
    position:fixed;top:0;right:0;bottom:0;z-index:60;
    width:min(380px,92vw);
    background:var(--surface);
    border-left:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 24px) 26px 26px;
    transform:translateX(100%);
    transition:transform .4s cubic-bezier(.2,.8,.25,1);
    overflow-y:auto;
    display:flex;flex-direction:column;gap:16px;
  }
  .panel.open{transform:translateX(0);}
  .panel-close{align-self:flex-end;font-size:0.72rem;letter-spacing:0.1em;color:var(--muted);}
  .panel-close:hover{color:var(--text);}
  .panel .pnum{font-size:0.75rem;color:var(--muted);}
  .panel h2{font-size:1.7rem;}
  .panel-tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:-8px;}
  .panel-tags .tag-chip{font-size:0.7rem;padding:5px 12px;}
  .panel-bio{font-size:0.92rem;line-height:1.6;color:var(--text);}
  .panel-bio[hidden]{display:none;}
  .panel-email{font-family:"IBM Plex Mono",monospace;font-size:0.76rem;color:var(--muted);margin:-8px 0 0;}
  .panel-email[hidden]{display:none;}
  .panel-ctas{display:flex;flex-direction:column;gap:10px;}
  .panel .cta{
    display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:0;
    border:1px solid var(--text);color:var(--text);font-size:0.8rem;letter-spacing:0.04em;text-transform:uppercase;
    align-self:flex-start;transition:background .2s ease, color .2s ease;
  }
  .panel .cta:hover{background:var(--text);color:var(--bg);}
  .panel .cta svg{width:12px;height:12px;stroke:currentColor;fill:none;}

  /* ---------------- submit / edit overlay ---------------- */
  .submit-overlay{
    position:fixed;inset:0;z-index:90;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;
    padding:calc(var(--header-h) + 24px) 24px 48px;
    opacity:0;visibility:hidden;transition:opacity .3s ease;
    overflow-y:auto;
  }
  .submit-overlay.open{opacity:1;visibility:visible;}
  .submit-inner{max-width:480px;width:100%;}
  .submit-title{font-size:1.3rem;margin-bottom:22px;}
  .submit-tabs{display:flex;gap:10px;margin-bottom:26px;}
  .submit-tab{font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;padding:8px 16px;border:1px solid var(--line);color:var(--muted);}
  .submit-tab.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .submit-form{display:flex;flex-direction:column;gap:16px;}
  .submit-form[hidden]{display:none;}
  .submit-form label{display:flex;flex-direction:column;gap:6px;font-size:0.76rem;letter-spacing:0.04em;color:var(--muted);}
  .submit-form input,.submit-form textarea{font-family:inherit;font-size:0.9rem;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:10px 12px;outline:none;}
  .submit-form input:focus,.submit-form textarea:focus{border-color:var(--text);}
  .submit-form textarea{resize:vertical;min-height:64px;}
  .submit-form input[type=file]{padding:8px 0;background:none;border:none;font-size:0.8rem;}
  .submit-form input[readonly]{background:var(--surface);color:var(--muted);cursor:default;}
  .tag-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:-8px;}
  .tag-pick-chip{
    font-family:"IBM Plex Mono",monospace;font-size:0.68rem;letter-spacing:0.03em;
    padding:6px 12px;border:1px solid var(--line);color:var(--muted);
    background:none;cursor:pointer;white-space:nowrap;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .tag-pick-chip:hover{border-color:var(--text);color:var(--text);}
  .tag-pick-chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .tag-custom-input{
    font-family:inherit;font-size:0.82rem;background:var(--surface);border:1px solid var(--line);
    color:var(--text);padding:9px 12px;outline:none;margin-top:-8px;
  }
  .tag-custom-input:focus{border-color:var(--text);}
  .photo-adjust-wrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:-6px;}
  .photo-adjust{
    position:relative;
    width:140px;height:140px;border-radius:50%;
    background-color:var(--surface);border:1px solid var(--line);
    background-size:cover;background-position:50% 50%;background-repeat:no-repeat;
    cursor:grab;touch-action:none;
  }
  .photo-adjust:active{cursor:grabbing;}
  .photo-adjust[hidden]{display:none;}
  /* shows where the CD's real spindle hole (12.5% of its diameter, same as
     .disc-hole) will sit, so a face doesn't end up centered right on top of it */
  .photo-adjust-hole{
    position:absolute;left:50%;top:50%;
    width:12.5%;height:12.5%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(10,10,10,0.5);
    pointer-events:none;
  }
  .photo-adjust-hint{font-size:0.68rem;color:var(--muted);}
  .photo-adjust-hint[hidden]{display:none;}
  .submit-row{display:flex;gap:12px;}
  .submit-row label{flex:1;}
  .submit-hint{font-size:0.68rem;color:var(--muted);margin-top:-8px;}
  .submit-msg{font-size:0.78rem;min-height:1.2em;color:var(--muted);}
  .submit-msg.err{color:#b00020;}
  .submit-msg.ok{color:#0a7a2f;}
  .submit-actions{display:flex;gap:14px;align-items:center;}
  .submit-form button[type=submit]{
    align-self:flex-start;padding:11px 22px;border:1px solid var(--text);
    font-size:0.8rem;letter-spacing:0.04em;text-transform:uppercase;
    transition:background .2s ease, color .2s ease;
  }
  .submit-form button[type=submit]:hover{background:var(--text);color:var(--bg);}
  .submit-form button[type=submit]:disabled{opacity:0.4;cursor:default;}
  .submit-form button.text-btn{font-size:0.74rem;letter-spacing:0.06em;color:var(--muted);text-decoration:underline;}
  .submit-form button.text-btn:hover{color:var(--text);}
  .danger-zone{
    margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);
    display:flex;flex-direction:column;gap:4px;
  }
  .submit-form button.danger-btn{color:#b00020;}
  .submit-form button.danger-btn:hover{color:#7a0016;}

  ::selection{background:var(--text);color:var(--bg);}

  /* ---------------- credit ---------------- */
  .credit{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    z-index:5;text-align:center;
    font-family:"IBM Plex Mono",monospace;font-size:0.64rem;letter-spacing:0.08em;
    color:var(--muted);opacity:0.45;
    pointer-events:none;
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">

<div class="topbar">
  <div class="wordmark">同學錄</div>
  <div style="display:flex;gap:14px;align-items:center;">
    <div class="filter-tags" id="filterTags" hidden></div>
    <div class="filter-input-wrap">
      <input type="text" id="filterInput" class="filter-input" list="tagSuggestions" placeholder="輸入標籤篩選">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  // ============================================================
  // CONFIG — pick ONE data source.
  //
  // Option A (recommended): Supabase — lets students edit their own
  // data later. Paste your project URL + anon public key below.
  // See README.md ("Supabase 設定") for the full walkthrough incl.
  // the SQL to run once in the Supabase SQL editor.
  //
  // Option B: a published Google Sheet CSV link (read-only, no edit
  // flow). Only used if SUPABASE_URL is left empty.
  //
  // Leave both empty to show the demo roster below instead.
  // ============================================================
  var SUPABASE_URL = "https://gprlshtecrpttccdyeup.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_mCEeggua_V--_EeNe2nbHQ_9MECDkJX";
  var SHEET_CSV_URL = "";

  var sbClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // demo roster, shown until SHEET_CSV_URL is set (or if the fetch fails)
  // image: null shows a placeholder — a live sheet fills this from each student's upload
  // no demo roster — the stage shows a loading/error message until the
  // real data source (Supabase or a Sheet CSV) has something to show
  var DEMO_DATA = [];

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stageInner = document.getElementById('stageInner');
  var indexList = document.getElementById('indexList');
  var currentData = [];

  // Every student field (name, tags, bio, links, photo URL...) is untrusted
  // input — anyone with the public anon key can write to the database
  // directly, bypassing this page's own form entirely. Since several spots
  // below build markup with innerHTML/style strings, everything that came
  // from the database gets HTML-escaped before it's inserted, and link
  // hrefs are restricted to http(s) only (blocks "javascript:" etc).
  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function safeHref(url){
    var m = /^([a-zA-Z][a-zA-Z0-9+.-]*):/.exec(url || '');
    if(!m) return '';
    var scheme = m[1].toLowerCase();
    if(scheme !== 'http' && scheme !== 'https') return '';
    return url;
  }

  // ---- turn a Google Sheet CSV export into the roster array ----
  // shuffled fresh each page load, so the CD order isn't the same every visit
  function shuffleRoster(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function parseCsv(text){
    var rows = [], row = [], field = '', inQuotes = false;
    for(var i = 0; i < text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else field += c;
      } else if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        if(row.length > 1 || row[0] !== ''){ rows.push(row); }
        row = [];
      } else field += c;
    }
    if(field !== '' || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  // accepts a raw Google Drive share link (from a Forms file-upload answer)
  // and rewrites it into a URL that actually hotlinks as an <img> source
  function driveDirectLink(url){
    if(!url) return null;
    var m = url.match(/[-\w]{25,}/); // the file ID
    if(!m) return /^https?:\/\//.test(url) ? url : null; // maybe already a plain image URL
    return 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w1000';
  }

  function csvToRoster(text){
    var rows = parseCsv(text);
    if(rows.length < 2) return [];
    var header = rows[0].map(function(h){ return h.trim(); });
    var col = {};
    header.forEach(function(h, i){ col[h] = i; });
    function get(r, name){ return col[name] !== undefined ? (r[col[name]] || '').trim() : ''; }

    return rows.slice(1).filter(function(r){ return get(r,'姓名'); }).map(function(r, i){
      var name = get(r,'姓名');
      var tags = [];
      for(var t = 1; t <= 5; t++){
        var v = get(r,'標籤'+t);
        if(v) tags.push(v);
      }
      return {
        id: 'p' + i,
        initial: name.slice(0,1),
        name: name,
        image: driveDirectLink(get(r,'照片上傳')),
        tags: tags,
        bio: get(r,'一句話介紹自己'),
        linkedin: get(r,'LinkedIn連結'),
        portfolio: get(r,'作品集連結')
      };
    });
  }

  // ---- simple centered placeholder text, shown in place of the CD row while
  // the roster is loading or if it couldn't be loaded ----
  function showStageMessage(text){
    currentData = [];
    stageInner.innerHTML = '<p class="stage-msg">' + text + '</p>';
    indexList.innerHTML = '';
    var countEl = document.getElementById('indexCount');
    if(countEl) countEl.textContent = '';
  }

  // ---- read the public roster from Supabase (students_public view — never
  // exposes edit_pin; email is included but only shown if the student chose
  // to fill it in, see README's SQL setup) ----
  function loadFromSupabase(){
    if(!sbClient) return;
    sbClient.from('students_public').select('*').order('created_at', {ascending:true})
      .then(function(res){
        if(res.error){
          console.warn('同學錄：讀取 Supabase 資料失敗。', res.error);
          showStageMessage('目前無法載入名單，請稍後重新整理頁面。');
          return;
        }
        var rows = res.data || [];
        var roster = rows.map(function(r){
          return {
            id: r.id,
            initial: (r.name||'').slice(0,1),
            name: r.name,
            image: r.photo_url || null,
            tags: r.tags || [],
            bio: r.bio || '',
            linkedin: r.linkedin || '',
            portfolio: r.portfolio || '',
            email: r.email || '',
            photoPos: r.photo_pos || '50% 50%'
          };
        });
        if(roster.length){
          renderRoster(shuffleRoster(roster));
        } else {
          showStageMessage('目前還沒有同學加入，按右上角「＋ 加入我的資料」搶頭香！');
        }
      })
      .catch(function(err){
        console.warn('同學錄：讀取 Supabase 資料失敗。', err);
        showStageMessage('目前無法載入名單，請稍後重新整理頁面。');
      });
  }

  // ---- build DOM (tidy horizontal row) ----
  function renderRoster(data){
    currentData = data;
    stageInner.innerHTML = '';
    indexList.innerHTML = '';

    data.forEach(function(d, i){
      var num = ('0'+(i+1)).slice(-2);

      var photoPos = escapeHtml(d.photoPos || '50% 50%');
      var safeImage = escapeHtml(d.image || '');
      var coverInner = d.image
        ? '<div class="disc-cover" style="background-image:url(\''+safeImage+'\');background-position:'+photoPos+'"></div>'
        : '<div class="disc-cover placeholder"><span class="ph-initial">'+escapeHtml(d.initial)+'</span></div>';

      var tagsHtml = d.tags.slice(0,5).map(function(t){ return '<span class="tag-chip">'+escapeHtml(t)+'</span>'; }).join('');

      var wrap = document.createElement('div');
      wrap.className = 'disc-wrap';
      wrap.id = 'wrap-' + d.id;
      wrap.innerHTML =
        '<div class="disc-3d" data-id="'+escapeHtml(d.id)+'">' +
          '<div class="disc-hl"></div>' +
          '<div class="disc-edge"></div>' +
          '<div class="disc-face disc-face-front">' +
            '<div class="disc-rim"></div>' +
            coverInner +
            '<div class="disc-texture"></div>' +
            '<div class="disc-sheen"></div>' +
            '<div class="disc-vignette"></div>' +
            '<div class="disc-hole"></div>' +
          '</div>' +
          '<div class="disc-face disc-face-back">' +
            '<div class="disc-rim"></div>' +
            '<div class="disc-groove"></div>' +
            '<div class="disc-hole"></div>' +
          '</div>' +
        '</div>' +
        '<div class="disc-name">' +
          '<span class="nm">'+escapeHtml(d.name)+'</span>' +
          '<div class="disc-tags">'+tagsHtml+'</div>' +
        '</div>';
      stageInner.appendChild(wrap);

      var avatarInner = d.image
        ? '<span class="iavatar" style="background-image:url(\''+safeImage+'\');background-position:'+photoPos+'"></span>'
        : '<span class="iavatar"><span class="iav-init">'+escapeHtml(d.initial)+'</span></span>';

      var item = document.createElement('a');
      item.className = 'index-item';
      item.dataset.target = d.id;
      item.innerHTML = avatarInner +
        '<span class="nm">'+escapeHtml(d.name)+'</span>' +
        '<span class="imeta mono">'+escapeHtml(d.tags.slice(0,2).join(' · '))+'</span>';
      item.dataset.search = (d.name+' '+d.tags.join(' ')).toLowerCase();
      indexList.appendChild(item);
    });

    var countEl = document.getElementById('indexCount');
    if(countEl) countEl.textContent = '共 ' + data.length + ' 位同學';

    attachDiscInteractions();
    applyFilter(activeFilterTags);
    refreshTagSuggestions();
    // the tag-picker chips (in the submit form, defined further below) also
    // need to pick up any newly-used tags once the real roster is in
    if(window.__refreshTagPickers) window.__refreshTagPickers();
  }

  // ---- tag filter: click one or more tag chips under a CD to show only CDs
  // that share at least one of the selected tags. Click a selected tag again
  // (or the "clear filter" pill) to remove it / clear all. ----
  var activeFilterTags = [];
  var pendingCollapseTimer = null;
  var filterTagsEl = document.getElementById('filterTags');
  function updateChipStates(){
    document.querySelectorAll('.disc-tags .tag-chip').forEach(function(chip){
      chip.classList.toggle('chip-active', activeFilterTags.indexOf(chip.textContent.trim()) !== -1);
    });
  }
  function removeFilterTag(tag){
    var next = activeFilterTags.slice();
    var idx = next.indexOf(tag);
    if(idx !== -1) next.splice(idx, 1);
    applyFilter(next);
  }
  function renderFilterBar(){
    if(!activeFilterTags.length){ filterTagsEl.hidden = true; filterTagsEl.innerHTML = ''; return; }
    filterTagsEl.hidden = false;
    filterTagsEl.innerHTML = activeFilterTags.map(function(t){
      return '<span class="filter-chip" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + ' ✕</span>';
    }).join('') + (activeFilterTags.length > 1 ? '<span class="filter-clear" id="filterClearAll">全部清除</span>' : '');
    filterTagsEl.querySelectorAll('.filter-chip').forEach(function(chip){
      chip.addEventListener('click', function(){ removeFilterTag(chip.dataset.tag); });
    });
    var clearAll = document.getElementById('filterClearAll');
    if(clearAll){ clearAll.addEventListener('click', function(){ applyFilter([]); }); }
  }
  function computeFilterStates(){
    var wraps = Array.prototype.slice.call(document.querySelectorAll('.disc-wrap'));
    return wraps.map(function(wrap){
      var id = wrap.id.replace(/^wrap-/, '');
      var d = currentData.filter(function(x){ return x.id === id; })[0];
      var match = activeFilterTags.length === 0 || (d && d.tags.some(function(t){
        return activeFilterTags.indexOf(t) !== -1;
      }));
      return {wrap: wrap, match: match};
    });
  }

  function applyFilter(tags){
    activeFilterTags = tags || [];
    // a second tag clicked before the previous collapse finished would otherwise
    // still fire on stale data — cancel it, the fresh collapse below supersedes it
    if(pendingCollapseTimer){ clearTimeout(pendingCollapseTimer); pendingCollapseTimer = null; }
    var states = computeFilterStates();

    // reveal newly-matching CDs immediately — no compensating slide animation,
    // they just take their spot in the row
    states.forEach(function(s){
      if(s.match && s.wrap.classList.contains('collapsed')){
        s.wrap.classList.remove('collapsed');
      }
    });
    states.forEach(function(s){
      if(s.match){ s.wrap.classList.remove('filtered-out'); }
      else { s.wrap.classList.add('filtered-out'); }
    });

    updateChipStates();
    renderFilterBar();

    // once the fade-out above finishes, drop the non-matches out of the flex row —
    // otherwise a match further down a long roster still needs a long scroll to
    // reach, since a merely-dimmed CD still takes up its full-width slot. No
    // compensating slide here either — the remaining CDs just settle into place.
    pendingCollapseTimer = setTimeout(function(){
      pendingCollapseTimer = null;
      // recompute against the *current* filter rather than trusting the snapshot
      // from when this timeout was scheduled — a second tag click in the meantime
      // may have changed which CDs should end up visible
      var fresh = computeFilterStates();
      fresh.forEach(function(s){
        if(!s.match && s.wrap.classList.contains('filtered-out') && !s.wrap.classList.contains('collapsed')){
          s.wrap.classList.add('collapsed');
        }
      });
    }, 320);
  }
  stageInner.addEventListener('click', function(ev){
    var chip = ev.target.closest('.disc-tags .tag-chip');
    if(!chip) return;
    var tag = chip.textContent.trim();
    var idx = activeFilterTags.indexOf(tag);
    var next = activeFilterTags.slice();
    if(idx === -1) next.push(tag); else next.splice(idx, 1);
    applyFilter(next);
  });

  // manual text input — type a tag and press Enter to add it to the filter
  // (works even for tags typed slightly differently from how discs render them,
  // since it's matched with the same exact comparison as clicking a chip)
  var filterInput = document.getElementById('filterInput');
  var tagSuggestions = document.getElementById('tagSuggestions');
  function refreshTagSuggestions(){
    var all = {};
    currentData.forEach(function(d){ (d.tags||[]).forEach(function(t){ all[t] = true; }); });
    tagSuggestions.innerHTML = Object.keys(all).sort().map(function(t){
      return '<option value="' + t.replace(/"/g,'&quot;') + '">';
    }).join('');
  }
  function addFilterFromInput(){
    var tag = filterInput.value.trim();
    if(!tag) return;
    if(activeFilterTags.indexOf(tag) === -1){
      applyFilter(activeFilterTags.concat([tag]));
    }
    filterInput.value = '';
  }
  filterInput.addEventListener('keydown', function(ev){
    if(ev.key !== 'Enter') return;
    // when typing with an IME (注音/拼音等), the first Enter just confirms the
    // composed text rather than reaching us — ignore that one so it doesn't
    // submit an incomplete tag; the real Enter fires right after with isComposing false.
    if(ev.isComposing || ev.keyCode === 229) return;
    ev.preventDefault();
    addFilterFromInput();
  });
  document.getElementById('filterInputAdd').addEventListener('click', addFilterFromInput);

  // ---- per-disc 3D drag rotation (grab the CD itself) + idle auto-spin ----
  function attachDiscInteractions(){
    document.querySelectorAll('.disc-3d').forEach(function(el){
      var state = {ry:0, rx:-6};
      var dragging = false, moved = 0, lastX=0, lastY=0, lastT=0, vel=0;
      var idleTween = null;

      // browsers vary in how reliably backface-visibility alone swaps the two
      // faces during a live 3D rotation, so drive it explicitly from the angle.
      // also sweeps the studio-light glare across the front face as it turns.
      var sheenEl = el.querySelector('.disc-sheen');
      function updateFace(ry){
        var a = ((ry % 360) + 360) % 360;
        el.classList.toggle('showing-back', a > 90 && a < 270);
        if(sheenEl){
          var pos = 50 + Math.sin(ry * Math.PI / 180) * 45;
          sheenEl.style.backgroundPosition = pos + '% ' + pos + '%';
        }
      }

      function startIdle(){
        if(reduceMotion || !window.gsap) return;
        if(idleTween) return; // already spinning — don't stack a second tween on top
        idleTween = gsap.to(el, {
          rotationY:"+=360",
          duration:24 + Math.random()*10,
          ease:"none",
          repeat:-1,
          onUpdate:function(){ updateFace(gsap.getProperty(el,"rotationY")); }
        });
      }
      function killIdle(){ if(idleTween){ idleTween.kill(); idleTween = null; } }
      if(window.gsap){ gsap.set(el, {transformPerspective:900, rotationX:state.rx}); }
      updateFace(0);
      startIdle();

      // pause the idle spin for discs scrolled far off-screen so a roster of
      // 100+ people doesn't keep animating dozens of CDs nobody can see —
      // this is the main cost at scale, everything else here is cheap per-disc
      if('IntersectionObserver' in window){
        var offscreenObserver = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){
              if(!dragging) startIdle();
            } else {
              killIdle();
            }
          });
        }, {root: rowViewport, rootMargin: '0px 500px', threshold: 0});
        offscreenObserver.observe(el);
      }

      el.addEventListener('pointerdown', function(ev){
        dragging = true; moved = 0;
        lastX = ev.clientX; lastY = ev.clientY; lastT = performance.now();
        el.setPointerCapture(ev.pointerId);
        ev.stopPropagation(); // don't also start a row-drag
        killIdle();
        if(window.gsap) gsap.killTweensOf(el, "rotationY,rotationX");
      });

      el.addEventListener('pointermove', function(ev){
        if(!dragging) return;
        ev.stopPropagation();
        var dx = ev.clientX - lastX, dy = ev.clientY - lastY;
        var now = performance.now();
        var dt = Math.max(now - lastT, 8); // floor dt so a couple of very close events can't spike the reading
        moved += Math.abs(dx) + Math.abs(dy);
        state.ry += dx * 0.5;
        state.rx = Math.max(-45, Math.min(45, state.rx - dy * 0.35));
        var instVel = (dx / dt) * 16;
        instVel = Math.max(-18, Math.min(18, instVel)); // clamp a single jumpy sample
        vel = vel * 0.7 + instVel * 0.3; // smooth over several samples — a light flick shouldn't read as a hard spin
        if(window.gsap){
          gsap.set(el, {rotationY: state.ry, rotationX: state.rx});
        } else {
          el.style.transform = 'rotateY('+state.ry+'deg) rotateX('+state.rx+'deg)';
        }
        updateFace(state.ry);
        lastX = ev.clientX; lastY = ev.clientY; lastT = now;
      });

      function endDrag(ev){
        if(!dragging) return;
        dragging = false;
        try{ el.releasePointerCapture(ev.pointerId); }catch(e){}

        if(moved < 6){
          openPanel(el.dataset.id);
        }

        if(window.gsap){
          var target = state.ry + vel * 6; // a real disc has inertial mass — a light flick shouldn't send it spinning far
          gsap.to(el, {
            rotationY: target,
            rotationX: state.rx * 0.4,
            duration: 1.7,
            ease: "power2.out",
            onUpdate: function(){
              state.ry = gsap.getProperty(el, "rotationY");
              state.rx = gsap.getProperty(el, "rotationX");
              updateFace(state.ry);
            },
            onComplete: startIdle
          });
        }
      }
      el.addEventListener('pointerup', endDrag);
      el.addEventListener('pointercancel', endDrag);
    });
  }

  // ---- drag the empty background to move the whole row (desktop mouse; touch uses native scroll) ----
  var rowViewport = document.getElementById('rowViewport');
  (function(){
    var isDown = false, startX = 0, startScroll = 0, lastX = 0, lastT = 0, vel = 0, moved = 0, raf = null;

    rowViewport.addEventListener('pointerdown', function(ev){
      if(ev.pointerType !== 'mouse') return; // let touch/trackpad use native scrolling
      if(ev.target.closest('.disc-3d')) return; // dragging a CD itself rotates it, not the row
      if(ev.target.closest('.tag-chip')) return; // clicking a tag chip filters, not drags the row
      isDown = true; moved = 0;
      startX = ev.clientX; startScroll = rowViewport.scrollLeft;
      lastX = ev.clientX; lastT = performance.now();
      rowViewport.classList.add('dragging');
      rowViewport.setPointerCapture(ev.pointerId);
      cancelAnimationFrame(raf);
    });

    rowViewport.addEventListener('pointermove', function(ev){
      if(!isDown) return;
      var dx = ev.clientX - startX;
      moved += Math.abs(ev.clientX - lastX);
      rowViewport.scrollLeft = startScroll - dx;
      var now = performance.now();
      var dt = Math.max(now - lastT, 8); // floor dt so a couple of very close events can't spike the reading
      var instVel = (ev.clientX - lastX) / dt;
      instVel = Math.max(-3.5, Math.min(3.5, instVel)); // clamp a single jumpy sample, but leave room for a real hard swipe to register
      vel = vel * 0.7 + instVel * 0.3; // smooth over several samples instead of trusting the last one
      lastX = ev.clientX; lastT = now;
    });

    // after the drag/inertia settles, ease the nearest CD to the horizontal
    // center of the viewport so browsing always ends on a centered disc
    function snapToNearest(){
      var items = document.querySelectorAll('.disc-wrap');
      if(!items.length) return;
      var vpRect = rowViewport.getBoundingClientRect();
      var vpCenter = vpRect.left + vpRect.width / 2;
      var closestDist = Infinity, closestCenter = 0;
      items.forEach(function(el){
        var r = el.getBoundingClientRect();
        var center = r.left + r.width / 2;
        var dist = Math.abs(center - vpCenter);
        if(dist < closestDist){ closestDist = dist; closestCenter = center; }
      });
      var target = rowViewport.scrollLeft + (closestCenter - vpCenter);
      target = Math.max(0, Math.min(target, rowViewport.scrollWidth - rowViewport.clientWidth));
      if(window.gsap){
        gsap.to(rowViewport, {scrollLeft: target, duration: 0.6, ease: "power3.out"});
      } else if(!reduceMotion){
        rowViewport.scrollTo({left: target, behavior: 'smooth'});
      } else {
        rowViewport.scrollLeft = target;
      }
    }

    function endDrag(ev){
      if(!isDown) return;
      isDown = false;
      rowViewport.classList.remove('dragging');
      try{ rowViewport.releasePointerCapture(ev.pointerId); }catch(e){}

      function step(){
        rowViewport.scrollLeft -= vel * 16;
        vel *= 0.94;
        if(Math.abs(vel) > 0.02){
          raf = requestAnimationFrame(step);
        } else {
          snapToNearest();
        }
      }
      raf = requestAnimationFrame(step);
    }
    rowViewport.addEventListener('pointerup', endDrag);
    rowViewport.addEventListener('pointercancel', endDrag);
    rowViewport.addEventListener('pointerleave', function(ev){ if(isDown) endDrag(ev); });
  })();

  // ---- add / edit submission modal (Supabase-backed) ----
  (function(){
    var submitBtn = document.getElementById('submitBtn');
    var submitOverlay = document.getElementById('submitOverlay');

    var lookupForm = document.getElementById('lookupForm');
    var editForm = document.getElementById('editForm');
    var editingId = null;
    var editingOldPhotoUrl = '';

    if(!sbClient){
      // no Supabase configured yet — hide the button rather than show a form that can't submit
      submitBtn.style.display = 'none';
      return;
    }

    function setMsg(el, text, kind){
      el.textContent = text;
      el.className = 'submit-msg' + (kind ? ' ' + kind : '');
    }
    function collectTags(str){
      return (str||'').split(/[,，、]/).map(function(s){ return s.trim(); }).filter(Boolean).slice(0,5);
    }

    // a starter set of tags so the first few students aren't typing from a
    // blank page — everyone after that can also pick from whatever tags
    // already exist in the roster, instead of each person inventing their
    // own wording and the tag list slowly fragmenting into duplicates.
    var DEFAULT_TAGS = [
      'UI設計','UX設計','平面設計','品牌識別','Figma','插畫','攝影','剪輯','動畫',
      '3D建模','網頁前端','網頁後端','App開發','遊戲設計','產品企劃','專案管理',
      '行銷企劃','社群經營','文案撰寫','簡報設計','資料分析','創業'
    ];
    function tagPool(){
      var pool = DEFAULT_TAGS.slice();
      var seen = {};
      pool.forEach(function(t){ seen[t] = true; });
      currentData.forEach(function(d){
        (d.tags||[]).forEach(function(t){
          if(!seen[t]){ seen[t] = true; pool.push(t); }
        });
      });
      return pool;
    }
    // a clickable set of tag chips backing a hidden/readonly text input —
    // clicking toggles a tag in/out of the (max 5) selection; typing in the
    // adjacent "custom" input and hitting Enter adds one that isn't listed.
    function initTagPicker(inputEl, pickerEl, customInputEl){
      function getSelected(){ return collectTags(inputEl.value); }
      function setSelected(tags){ inputEl.value = tags.join('、'); render(); }
      function toggle(tag){
        var sel = getSelected();
        var idx = sel.indexOf(tag);
        if(idx !== -1){ sel.splice(idx, 1); }
        else {
          if(sel.length >= 5) return; // 已達 5 個上限，忽略
          sel.push(tag);
        }
        setSelected(sel);
      }
      function render(){
        var sel = getSelected();
        var pool = tagPool();
        // 學生已經選過、但目前不在預設/其他同學標籤池裡的標籤(少見)，
        // 還是要顯示出來，不然點過的標籤會突然消失
        sel.forEach(function(t){ if(pool.indexOf(t) === -1) pool.push(t); });
        pickerEl.innerHTML = pool.map(function(t){
          var active = sel.indexOf(t) !== -1;
          return '<button type="button" class="tag-pick-chip' + (active ? ' active' : '') + '" data-tag="' +
            escapeHtml(t) + '">' + escapeHtml(t) + '</button>';
        }).join('');
      }
      pickerEl.addEventListener('click', function(ev){
        var chip = ev.target.closest('.tag-pick-chip');
        if(!chip) return;
        toggle(chip.dataset.tag);
      });
      if(customInputEl){
        customInputEl.addEventListener('keydown', function(ev){
          if(ev.key !== 'Enter') return;
          if(ev.isComposing || ev.keyCode === 229) return; // let IME composition finish first
          ev.preventDefault();
          var tag = customInputEl.value.trim();
          if(!tag) return;
          var sel = getSelected();
          if(sel.indexOf(tag) === -1 && sel.length < 5){ sel.push(tag); setSelected(sel); }
          customInputEl.value = '';
        });
      }
      render();
      return {render: render};
    }

    // students paste LinkedIn/作品集連結 in all kinds of shapes — some without
    // "https://", some with full-width or stray punctuation. Rather than
    // relying on everyone remembering to type it a specific way, quietly fix
    // up what we can before it's saved, instead of rejecting it.
    function normalizeUrl(str){
      var v = (str||'').trim();
      if(!v) return '';
      v = v.replace(/^[「『【\[]+|[」』】\]]+$/g, ''); // stray brackets some paste in by habit
      if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(v)){
        v = 'https://' + v.replace(/^\/+/, '');
      }
      return v;
    }
    var MAX_PHOTO_BYTES = 5 * 1024 * 1024; // 5MB
    function uploadPhoto(file){
      if(!file) return Promise.resolve('');
      var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
      var path = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
      return sbClient.storage.from('photos').upload(path, file, {cacheControl:'3600', upsert:false})
        .then(function(up){
          if(up.error) throw up.error;
          var pub = sbClient.storage.from('photos').getPublicUrl(path);
          return pub.data.publicUrl;
        });
    }
    // pulls the "<file>.jpg" path back out of a public Storage URL so a
    // replaced photo's old file can be removed from the 'photos' bucket
    function storagePathFromPublicUrl(url){
      if(!url) return null;
      var marker = '/storage/v1/object/public/photos/';
      var idx = url.indexOf(marker);
      if(idx === -1) return null;
      try{ return decodeURIComponent(url.slice(idx + marker.length)); }
      catch(e){ return url.slice(idx + marker.length); }
    }
    function deleteOldPhoto(oldUrl, newUrl){
      if(!oldUrl || oldUrl === newUrl) return; // nothing uploaded, or somehow the same file
      var oldPath = storagePathFromPublicUrl(oldUrl);
      if(!oldPath) return;
      sbClient.storage.from('photos').remove([oldPath]).catch(function(err){
        console.warn('同學錄：刪除舊照片失敗(不影響新照片顯示)。', err);
      });
    }

    // ---- circular photo-position adjuster: shows the chosen photo in a round
    // preview and lets the student drag it to pick which part of the photo
    // ends up centered once the CD crops it to a circle. state.x/state.y are
    // a background-position percentage pair, submitted alongside the photo. ----
    function initPhotoAdjust(el, hintEl, fileInput, state){
      function applyPos(){ el.style.backgroundPosition = state.x + '% ' + state.y + '%'; }
      function showWithSrc(src){
        el.style.backgroundImage = "url('" + src + "')";
        el.hidden = false;
        if(hintEl) hintEl.hidden = false;
      }
      fileInput.addEventListener('change', function(){
        var file = fileInput.files[0];
        if(!file) return;
        if(file.size > MAX_PHOTO_BYTES){
          alert('照片檔案太大了(上限 5MB)，請選一張小一點的照片，或先壓縮再上傳。');
          fileInput.value = '';
          el.hidden = true;
          if(hintEl) hintEl.hidden = true;
          return;
        }
        var reader = new FileReader();
        reader.onload = function(ev){
          state.x = 50; state.y = 50;
          applyPos();
          showWithSrc(ev.target.result);
        };
        reader.readAsDataURL(file);
      });

      var dragging = false, startX = 0, startY = 0, startPosX = 50, startPosY = 50;
      el.addEventListener('pointerdown', function(ev){
        dragging = true;
        startX = ev.clientX; startY = ev.clientY;
        startPosX = state.x; startPosY = state.y;
        el.setPointerCapture(ev.pointerId);
      });
      el.addEventListener('pointermove', function(ev){
        if(!dragging) return;
        var rect = el.getBoundingClientRect();
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        state.x = Math.max(0, Math.min(100, startPosX - (dx / rect.width) * 100));
        state.y = Math.max(0, Math.min(100, startPosY - (dy / rect.height) * 100));
        applyPos();
      });
      function endDrag(ev){ dragging = false; try{ el.releasePointerCapture(ev.pointerId); }catch(e){} }
      el.addEventListener('pointerup', endDrag);
      el.addEventListener('pointercancel', endDrag);

      return {
        showExisting: function(src, posStr){
          if(!src) return;
          var parts = (posStr || '50% 50%').replace(/%/g,'').trim().split(/\s+/).map(Number);
          state.x = isFinite(parts[0]) ? parts[0] : 50;
          state.y = isFinite(parts[1]) ? parts[1] : 50;
          applyPos();
          showWithSrc(src);
        },
        reset: function(){
          state.x = 50; state.y = 50; applyPos();
          el.style.backgroundImage = '';
          el.hidden = true;
          if(hintEl) hintEl.hidden = true;
        }
      };
    }

    var nPhotoPos = {x:50, y:50};
    var nPhotoAdjust = initPhotoAdjust(
      document.getElementById('nPhotoAdjust'), document.getElementById('nPhotoAdjustHint'),

    );

    editForm.addEventListener('submit', function(ev){

        uploadedPhotoUrl = photoUrl;

        // send the adjusted position whenever a photo is involved — either a

      }).then(function(res){

        if(res.error){
          if(/duplicate|unique/i.test(res.error.message || '')){
            setMsg(msg, '這個 Email 已經被別人用過了，換一個試試，或留空不填也可以。', 'err');
          } else {
            setMsg(msg, '更新失敗：' + res.error.message, 'err');
          }
          return;
        }
        // only once the new row is safely saved — remove the photo it replaced
        if(uploadedPhotoUrl){ deleteOldPhoto(editingOldPhotoUrl, uploadedPhotoUrl); }
        setMsg(msg, '已更新！', 'ok');
        loadFromSupabase();
      }).catch(function(err){
        btn.disabled = false;
        setMsg(msg, '更新失敗：' + (err && err.message || err), 'err');
      });
    });

    document.getElementById('editCancel').addEventListener('click', function(){
      editForm.hidden = true;
      lookupForm.hidden = false;
      editingId = null;
      editingOldPhotoUrl = '';
      ePhotoAdjust.reset();
      editForm.reset();
      eTagPicker.render();
    });

    document.getElementById('deleteAccountBtn').addEventListener('click', function(){
      if(!editingId) return;
      var name = document.getElementById('eName').value.trim();
      var ok = confirm('確定要把「' + (name || '這筆資料') + '」從同學錄刪除嗎？此動作無法復原。');
      if(!ok) return;
      var msg = document.getElementById('editMsg');
      var btn = this;
      var photoUrl = editingOldPhotoUrl;
      var idToDelete = editingId;
      btn.disabled = true;
      setMsg(msg, '刪除中...', '');
      sbClient.from('students').delete().eq('id', idToDelete).then(function(res){
        btn.disabled = false;
        if(res.error){
          setMsg(msg, '刪除失敗：' + res.error.message, 'err');
          return;
        }
        if(photoUrl){
          var path = storagePathFromPublicUrl(photoUrl);
          if(path){
            sbClient.storage.from('photos').remove([path]).catch(function(err){
              console.warn('同學錄：刪除照片檔案失敗(不影響資料已刪除)。', err);
            });
          }
        }
        editForm.hidden = true;
        lookupForm.hidden = false;
        editingId = null;
        editingOldPhotoUrl = '';
        ePhotoAdjust.reset();
        editForm.reset();
        eTagPicker.render();
        var lookupMsg = document.getElementById('lookupMsg');
        if(lookupMsg){ setMsg(lookupMsg, '已刪除你的資料。', 'ok'); }
        loadFromSupabase();
      }).catch(function(err){
        btn.disabled = false;
        setMsg(msg, '刪除失敗：' + (err && err.message || err), 'err');
      });
    });
  })();

  // ---- boot: show a loading placeholder immediately, then swap in the live data source ----
  showStageMessage('載入中...');
  if(sbClient){
    loadFromSupabase();
  } else if(SHEET_CSV_URL){
    fetch(SHEET_CSV_URL)
      .then(function(res){ if(!res.ok) throw new Error('sheet fetch failed'); return res.text(); })
      .then(function(text){
        var roster = csvToRoster(text);
        if(roster.length){
          renderRoster(shuffleRoster(roster));
        } else {
          showStageMessage('目前還沒有同學資料。');
        }
      })
      .catch(function(err){
        console.warn('同學錄：讀取 Google Sheet 失敗。', err);
        showStageMessage('目前無法載入名單，請稍後重新整理頁面。');
      });
  } else {
    showStageMessage('尚未設定資料來源，請完成 Supabase 設定(見 README)。');
  }
})();
</script>
